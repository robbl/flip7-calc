<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flip7 Card Tracker + Recommendation</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --good: #22c55e;
      --bad: #ef4444;
      --accent: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #cbd5e1;
        --text: #0f172a;
        --muted: #475569;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    h1, h2 { margin: 0 0 8px 0; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1rem; }
    p { margin: 6px 0; color: var(--muted); }
    .good { color: var(--good); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    .muted { color: var(--muted); }
    .card-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    }
    .card-tile {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: grid;
      gap: 6px;
    }
    .card-tile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in oklab, var(--card) 85%, var(--accent));
      color: var(--text);
      padding: 4px 8px;
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Flip7: Card Grid + Simple Recommendation</h1>
  </section>

  <section class="card">
    <h2>All cards</h2>
    <div id="cardGrid" class="card-grid"></div>
    <p id="actionError" class="bad" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2>Recommendation (first to 200)</h2>
    <p id="resultLine"></p>
    <p id="recommendationLine"></p>
    <p id="explanationLine" class="muted"></p>
  </section>
</main>

<script>
  const STORAGE_KEY = "flip7-calc-state-v2";
  const LEGACY_STORAGE_KEY = "flip7-calc-state-v1";
  const SAFE_THRESHOLD_PERCENT = 70;
  const STANDARD_DECK = [
    { label: "0", count: 1 },
    { label: "1", count: 1 },
    { label: "2", count: 2 },
    { label: "3", count: 3 },
    { label: "4", count: 4 },
    { label: "5", count: 5 },
    { label: "6", count: 6 },
    { label: "7", count: 7 },
    { label: "8", count: 8 },
    { label: "9", count: 9 },
    { label: "10", count: 10 },
    { label: "11", count: 11 },
    { label: "12", count: 12 },
    { label: "+2", count: 3 },
    { label: "Freeze", count: 3 },
    { label: "Flip 3", count: 3 },
    { label: "Second Chance", count: 3 }
  ];

  const els = {
    cardGrid: document.getElementById("cardGrid"),
    actionError: document.getElementById("actionError"),
    resultLine: document.getElementById("resultLine"),
    recommendationLine: document.getElementById("recommendationLine"),
    explanationLine: document.getElementById("explanationLine")
  };

  let state = {
    played: Object.fromEntries(STANDARD_DECK.map(d => [d.label, 0])),
    hand: {}
  };

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  function isNumberCardLabel(label) {
    if (!/^\d+$/.test(label)) return false;
    const n = Number(label);
    return n >= 0 && n <= 12;
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      const nextPlayed = Object.fromEntries(STANDARD_DECK.map(d => [d.label, 0]));
      const nextHand = {};
      for (const d of STANDARD_DECK) {
        const played = clamp(Number(parsed?.played?.[d.label]) || 0, 0, d.count);
        nextPlayed[d.label] = played;
      }
      for (const [label, value] of Object.entries(parsed?.hand || {})) {
        if (!isNumberCardLabel(label)) continue;
        if (!(label in nextPlayed)) continue;
        const handCount = clamp(Number(value) || 0, 0, nextPlayed[label]);
        if (handCount > 0) nextHand[label] = handCount;
      }
      state = { played: nextPlayed, hand: nextHand };
      saveState();
    } catch {
      // Ignore invalid saved state.
    }
  }

  function remainingFor(label) {
    const item = STANDARD_DECK.find(d => d.label === label);
    if (!item) return 0;
    return Math.max(0, item.count - (state.played[label] || 0));
  }

  function updateRecommendation() {
    const remainingTotal = STANDARD_DECK.reduce((sum, d) => sum + remainingFor(d.label), 0);
    const handLabels = Object.keys(state.hand).filter(k => state.hand[k] > 0);
    const bustCards = handLabels.reduce((sum, label) => sum + remainingFor(label), 0);
    const safeCards = Math.max(0, remainingTotal - bustCards);
    const safeP = remainingTotal === 0 ? 0 : safeCards / remainingTotal;
    const bustP = remainingTotal === 0 ? 0 : bustCards / remainingTotal;

    const safePct = (safeP * 100).toFixed(2);
    const bustPct = (bustP * 100).toFixed(2);
    els.resultLine.textContent = `Safe draw: ${safePct}% | Bust: ${bustPct}%`;

    if (remainingTotal === 0) {
      els.recommendationLine.textContent = "Recommendation: STOP (deck is empty)";
      els.recommendationLine.className = "bad";
      els.explanationLine.textContent = "No cards remain.";
      return;
    }

    const shouldDraw = safeP * 100 >= SAFE_THRESHOLD_PERCENT;
    els.recommendationLine.textContent = shouldDraw
      ? "Recommendation: TAKE the next card"
      : "Recommendation: STOP";
    els.recommendationLine.className = shouldDraw ? "good" : "bad";
    els.explanationLine.textContent = `Simple race-to-200 rule: take when safe draw is at least ${SAFE_THRESHOLD_PERCENT}%. (${safeCards} safe / ${remainingTotal} remaining)`;
  }

  function renderCardGrid() {
    els.cardGrid.innerHTML = "";
    for (const d of STANDARD_DECK) {
      const tile = document.createElement("div");
      tile.className = "card-tile";

      const header = document.createElement("div");
      header.className = "card-tile-header";
      const name = document.createElement("span");
      name.textContent = d.label;
      const counts = document.createElement("span");
      counts.className = "muted";
      const handCount = state.hand[d.label] || 0;
      counts.textContent = isNumberCardLabel(d.label)
        ? `${state.played[d.label] || 0}/${d.count}${handCount > 0 ? ` (hand ${handCount})` : ""}`
        : `${state.played[d.label] || 0}/${d.count}`;
      header.append(name, counts);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const plusOne = document.createElement("button");
      plusOne.type = "button";
      plusOne.dataset.label = d.label;
      plusOne.dataset.action = "inc";
      plusOne.textContent = "+1";

      const minusOne = document.createElement("button");
      minusOne.type = "button";
      minusOne.dataset.label = d.label;
      minusOne.dataset.action = "dec";
      minusOne.textContent = "-1";

      actions.append(plusOne, minusOne);

      if (isNumberCardLabel(d.label)) {
        const plusHand = document.createElement("button");
        plusHand.type = "button";
        plusHand.dataset.label = d.label;
        plusHand.dataset.action = "hand";
        plusHand.textContent = "+hand";
        actions.appendChild(plusHand);
      }

      tile.append(header, actions);
      els.cardGrid.appendChild(tile);
    }
  }

  function render() {
    renderCardGrid();
    updateRecommendation();
  }

  function applyCardDelta(label, playedDelta, handDelta) {
    const item = STANDARD_DECK.find(d => d.label === label);
    if (!item) {
      els.actionError.textContent = `Unknown card: ${label}.`;
      return;
    }

    const beforePlayed = state.played[label] || 0;
    const beforeHand = state.hand[label] || 0;
    const nextPlayed = beforePlayed + playedDelta;
    const nextHand = beforeHand + handDelta;

    if (nextPlayed < 0) {
      els.actionError.textContent = `Cannot reduce ${label}: already at 0 played.`;
      return;
    }
    if (nextPlayed > item.count) {
      els.actionError.textContent = `Cannot add ${label}: no remaining copies in deck.`;
      return;
    }
    if (nextHand < 0) {
      els.actionError.textContent = `Cannot reduce ${label} in hand: already at 0.`;
      return;
    }
    if (nextHand > nextPlayed) {
      els.actionError.textContent = `Hand count for ${label} cannot exceed played count.`;
      return;
    }

    state.played[label] = nextPlayed;
    if (nextHand > 0) state.hand[label] = nextHand;
    else delete state.hand[label];
    els.actionError.textContent = "";
    saveState();
    render();
  }

  els.cardGrid.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    const label = button.dataset.label;
    const action = button.dataset.action;
    if (!label || !action) return;

    if (action === "inc") {
      applyCardDelta(label, 1, 0);
      return;
    }
    if (action === "dec") {
      const handCount = state.hand[label] || 0;
      applyCardDelta(label, -1, handCount > 0 ? -1 : 0);
      return;
    }
    if (action === "hand") {
      applyCardDelta(label, 1, 1);
    }
  });

  loadState();
  render();
</script>
</body>
</html>
