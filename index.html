<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flip7 Tracker</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --good: #22c55e;
      --bad: #ef4444;
      --accent: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #cbd5e1;
        --text: #0f172a;
        --muted: #475569;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px;
      display: grid;
      gap: 8px;
    }
    p { margin: 4px 0; color: var(--muted); }
    .good { color: var(--good); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    .muted { color: var(--muted); }
    .card-grid {
      display: grid;
      gap: 6px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }
    .card-tile {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      display: grid;
      gap: 4px;
    }
    .card-tile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .card-actions {
      display: flex;
      gap: 4px;
    }
    button {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: color-mix(in oklab, var(--card) 85%, var(--accent));
      color: var(--text);
      padding: 4px 6px;
      font: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    button svg { display: block; }
    .recommendation {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }
    .rec-icon { display: flex; }
    .rec-icon.good { color: var(--good); }
    .rec-icon.bad { color: var(--bad); }
    .rec-icon.muted { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <div id="cardGrid" class="card-grid"></div>
  <p id="actionError" class="bad" aria-live="polite"></p>
  <div class="recommendation">
    <span id="resultLine" class="muted"></span>
    <span id="recommendationIcon" class="rec-icon muted" aria-live="polite"></span>
  </div>
</main>

<script>
  const STORAGE_KEY = "flip7-calc-state-v4";
  const LEGACY_STORAGE_KEY = "flip7-calc-state-v3";
  const SAFE_THRESHOLD_PERCENT = 70;
  const STANDARD_DECK = [
    { label: "0", count: 1 },
    { label: "1", count: 1 },
    { label: "2", count: 2 },
    { label: "3", count: 3 },
    { label: "4", count: 4 },
    { label: "5", count: 5 },
    { label: "6", count: 6 },
    { label: "7", count: 7 },
    { label: "8", count: 8 },
    { label: "9", count: 9 },
    { label: "10", count: 10 },
    { label: "11", count: 11 },
    { label: "12", count: 12 },
    { label: "+2", count: 1 },
    { label: "+4", count: 1 },
    { label: "+6", count: 1 },
    { label: "+8", count: 1 },
    { label: "+10", count: 1 },
    { label: "*2", count: 1 },
    { label: "Freeze", count: 3 },
    { label: "Second Chance", count: 3 },
    { label: "Flip 3", count: 3 }
  ];

  const THUMBS_UP_SVG = `<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>`;
  const THUMBS_DOWN_SVG = `<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22h0a3.13 3.13 0 0 1-3-3.88Z"/></svg>`;
  const PLUS_SVG = `<svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/></svg>`;
  const MINUS_SVG = `<svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="2" y1="7" x2="12" y2="7"/></svg>`;
  const HAND_SVG = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>`;

  const els = {
    cardGrid: document.getElementById("cardGrid"),
    actionError: document.getElementById("actionError"),
    resultLine: document.getElementById("resultLine"),
    recommendationIcon: document.getElementById("recommendationIcon")
  };

  let state = {
    played: Object.fromEntries(STANDARD_DECK.map(d => [d.label, 0])),
    hand: {}
  };

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  function isNumberCardLabel(label) {
    if (!/^\d+$/.test(label)) return false;
    const n = Number(label);
    return n >= 0 && n <= 12;
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      const nextPlayed = Object.fromEntries(STANDARD_DECK.map(d => [d.label, 0]));
      const nextHand = {};
      for (const d of STANDARD_DECK) {
        const played = clamp(Number(parsed?.played?.[d.label]) || 0, 0, d.count);
        nextPlayed[d.label] = played;
      }
      for (const [label, value] of Object.entries(parsed?.hand || {})) {
        if (!isNumberCardLabel(label)) continue;
        if (!(label in nextPlayed)) continue;
        const handCount = clamp(Number(value) || 0, 0, nextPlayed[label]);
        if (handCount > 0) nextHand[label] = handCount;
      }
      state = { played: nextPlayed, hand: nextHand };
      saveState();
    } catch {
      // Ignore invalid saved state.
    }
  }

  function remainingFor(label) {
    const item = STANDARD_DECK.find(d => d.label === label);
    if (!item) return 0;
    return Math.max(0, item.count - (state.played[label] || 0));
  }

  function updateRecommendation() {
    const remainingTotal = STANDARD_DECK.reduce((sum, d) => sum + remainingFor(d.label), 0);
    const handLabels = Object.keys(state.hand).filter(k => state.hand[k] > 0);
    const bustCards = handLabels.reduce((sum, label) => sum + remainingFor(label), 0);
    const safeCards = Math.max(0, remainingTotal - bustCards);
    const safeP = remainingTotal === 0 ? 0 : safeCards / remainingTotal;
    const bustP = remainingTotal === 0 ? 0 : bustCards / remainingTotal;

    const safePct = (safeP * 100).toFixed(2);
    const bustPct = (bustP * 100).toFixed(2);
    els.resultLine.textContent = `Safe: ${safePct}% | Bust: ${bustPct}%`;

    if (remainingTotal === 0) {
      els.recommendationIcon.innerHTML = THUMBS_DOWN_SVG;
      els.recommendationIcon.className = "rec-icon bad";
      els.recommendationIcon.setAttribute("aria-label", "Stop — deck is empty");
      return;
    }

    const shouldDraw = safeP * 100 >= SAFE_THRESHOLD_PERCENT;
    els.recommendationIcon.innerHTML = shouldDraw ? THUMBS_UP_SVG : THUMBS_DOWN_SVG;
    els.recommendationIcon.className = shouldDraw ? "rec-icon good" : "rec-icon bad";
    els.recommendationIcon.setAttribute("aria-label", shouldDraw ? "Take the next card" : "Stop");
  }

  function renderCardGrid() {
    els.cardGrid.innerHTML = "";
    for (const d of STANDARD_DECK) {
      const tile = document.createElement("div");
      tile.className = "card-tile";

      const header = document.createElement("div");
      header.className = "card-tile-header";
      const name = document.createElement("span");
      name.textContent = d.label;
      const counts = document.createElement("span");
      counts.className = "muted";
      const handCount = state.hand[d.label] || 0;
      counts.textContent = isNumberCardLabel(d.label)
        ? `${state.played[d.label] || 0}/${d.count}${handCount > 0 ? ` (hand ${handCount})` : ""}`
        : `${state.played[d.label] || 0}/${d.count}`;
      header.append(name, counts);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const plusOne = document.createElement("button");
      plusOne.type = "button";
      plusOne.dataset.label = d.label;
      plusOne.dataset.action = "inc";
      plusOne.setAttribute("aria-label", `+1 ${d.label}`);
      plusOne.innerHTML = PLUS_SVG;

      const minusOne = document.createElement("button");
      minusOne.type = "button";
      minusOne.dataset.label = d.label;
      minusOne.dataset.action = "dec";
      minusOne.setAttribute("aria-label", `-1 ${d.label}`);
      minusOne.innerHTML = MINUS_SVG;

      actions.append(plusOne, minusOne);

      if (isNumberCardLabel(d.label)) {
        const plusHand = document.createElement("button");
        plusHand.type = "button";
        plusHand.dataset.label = d.label;
        plusHand.dataset.action = "hand";
        plusHand.setAttribute("aria-label", `+hand ${d.label}`);
        plusHand.innerHTML = HAND_SVG;
        actions.appendChild(plusHand);
      }

      tile.append(header, actions);
      els.cardGrid.appendChild(tile);
    }
  }

  function render() {
    renderCardGrid();
    updateRecommendation();
  }

  function applyCardDelta(label, playedDelta, handDelta) {
    const item = STANDARD_DECK.find(d => d.label === label);
    if (!item) {
      els.actionError.textContent = `Unknown card: ${label}.`;
      return;
    }

    const beforePlayed = state.played[label] || 0;
    const beforeHand = state.hand[label] || 0;
    const nextPlayed = beforePlayed + playedDelta;
    const nextHand = beforeHand + handDelta;

    if (nextPlayed < 0) {
      els.actionError.textContent = `Cannot reduce ${label}: already at 0 played.`;
      return;
    }
    if (nextPlayed > item.count) {
      els.actionError.textContent = `Cannot add ${label}: no remaining copies in deck.`;
      return;
    }
    if (nextHand < 0) {
      els.actionError.textContent = `Cannot reduce ${label} in hand: already at 0.`;
      return;
    }
    if (nextHand > nextPlayed) {
      els.actionError.textContent = `Hand count for ${label} cannot exceed played count.`;
      return;
    }

    state.played[label] = nextPlayed;
    if (nextHand > 0) state.hand[label] = nextHand;
    else delete state.hand[label];
    els.actionError.textContent = "";
    saveState();
    render();
  }

  els.cardGrid.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    const label = button.dataset.label;
    const action = button.dataset.action;
    if (!label || !action) return;

    if (action === "inc") {
      applyCardDelta(label, 1, 0);
      return;
    }
    if (action === "dec") {
      const handCount = state.hand[label] || 0;
      applyCardDelta(label, -1, handCount > 0 ? -1 : 0);
      return;
    }
    if (action === "hand") {
      applyCardDelta(label, 1, 1);
    }
  });

  loadState();
  render();
</script>
</body>
</html>
